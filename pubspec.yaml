name: monopoly_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.1.0  # Añade esta línea debajo de dependencies
  qr_flutter: ^4.1.0      # Ya que también la estamos usando para generar el QR
  shared_preferences: ^2.3.3 # Revisa la última versión en pub.dev
  dio: ^5.4.1
  retrofit: 4.1.0
  json_annotation: 4.8.1
  cupertino_icons: ^1.0.8
  signalr_netcore: ^1.3.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  retrofit_generator: 8.1.0
  json_serializable: 6.7.1
  signalr_netcore: ^1.3.5
flutter:
  uses-material-design: true
  assets:
    - assets/fondo.png
    - assets/carta_trampa.png
    - assets/icon/         # Incluye todos los iconos de esa carpeta
    - assets/cartas/       # <--- Esto incluye todos los archivos dentro de 'cartas'